services:
  # ======================== Infrastructure ========================

  mysql:
    image: mysql:8.0
    container_name: travel-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - travel-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:15-alpine
    container_name: travel-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - travel-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  cassandra:
    image: cassandra:4.1
    container_name: travel-cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: TravelCluster
      CASSANDRA_DC: ${CASSANDRA_DC}
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    volumes:
      - cassandra_data:/var/lib/cassandra
      - ./infrastructure/cassandra/init.cql:/docker-entrypoint-initdb.d/init.cql
    networks:
      - travel-net
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: travel-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - travel-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: travel-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    ports:
      - "15672:15672"   # Management UI (for demo)
    networks:
      - travel-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ======================== Kong API Gateway ========================

  kong:
    image: kong:3.5
    container_name: travel-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"
      - "${KONG_ADMIN_PORT:-8001}:8001"
    depends_on:
      user-service:
        condition: service_healthy
      trip-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      recommendation-service:
        condition: service_healthy
      route-service:
        condition: service_healthy
    networks:
      - travel-net
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ======================== Backend Services ========================

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: travel-user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SERVER_PORT: ${USER_SERVICE_PORT}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - travel-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:${USER_SERVICE_PORT}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  trip-service:
    build:
      context: ./services/trip-service
      dockerfile: Dockerfile
    container_name: travel-trip-service
    environment:
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${TRIP_DB_NAME}
      PORT: ${TRIP_SERVICE_PORT}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST}:${RABBITMQ_PORT}${RABBITMQ_VHOST}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - travel-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:${TRIP_SERVICE_PORT}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  booking-service:
    build:
      context: ./services/booking-service
      dockerfile: Dockerfile
    container_name: travel-booking-service
    environment:
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${BOOKING_DB_NAME}
      PORT: ${BOOKING_SERVICE_PORT}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST}:${RABBITMQ_PORT}${RABBITMQ_VHOST}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      TRIP_SERVICE_URL: http://trip-service:${TRIP_SERVICE_PORT}
      JWT_SECRET: ${JWT_SECRET}
      SAGA_STEP_TIMEOUT_SECONDS: ${SAGA_STEP_TIMEOUT_SECONDS}
      SAGA_MAX_RETRIES: ${SAGA_MAX_RETRIES}
      SAGA_RETRY_BACKOFF_MS: ${SAGA_RETRY_BACKOFF_MS}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS}
      SAGA_RECOVERY_INTERVAL_SECONDS: ${SAGA_RECOVERY_INTERVAL_SECONDS}
      ENABLE_FAILURE_INJECTION: ${ENABLE_FAILURE_INJECTION}
      GIN_MODE: release
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - travel-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:${BOOKING_SERVICE_PORT}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  recommendation-service:
    build:
      context: ./services/recommendation-service
      dockerfile: Dockerfile
    container_name: travel-recommendation-service
    environment:
      CASSANDRA_HOST: ${CASSANDRA_HOST}
      CASSANDRA_PORT: ${CASSANDRA_PORT}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE}
      CASSANDRA_DC: ${CASSANDRA_DC}
      PORT: ${RECOMMENDATION_SERVICE_PORT}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST}:${RABBITMQ_PORT}${RABBITMQ_VHOST}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
    depends_on:
      cassandra:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - travel-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:${RECOMMENDATION_SERVICE_PORT}/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  route-service:
    build:
      context: ./services/route-service
      dockerfile: Dockerfile
    container_name: travel-route-service
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PORT: ${ROUTE_SERVICE_PORT}
      ROUTE_CACHE_TTL_SECONDS: ${ROUTE_CACHE_TTL_SECONDS}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - travel-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${ROUTE_SERVICE_PORT}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ======================== Frontend ========================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: travel-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      kong:
        condition: service_healthy
    networks:
      - travel-net

# ======================== Networks & Volumes ========================

networks:
  travel-net:
    driver: bridge

volumes:
  mysql_data:
  postgres_data:
  cassandra_data:
  redis_data:
  rabbitmq_data:
