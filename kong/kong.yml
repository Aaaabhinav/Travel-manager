_format_version: "3.0"

services:
  # ---- User Service (Java / Spring Boot) ----
  - name: user-service
    url: http://user-service:8081
    routes:
      - name: user-routes
        paths:
          - /api/users
        strip_path: true
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
    plugins:
      - name: cors
        config:
          origins:
            - http://localhost:3000
            - ".*"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - X-User-Id
            - X-User-Roles
            - X-Simulate-Failure
          exposed_headers:
            - X-Auth-Token
          credentials: true
          max_age: 3600

  # ---- Trip Service (Node.js / Express) ----
  - name: trip-service
    url: http://trip-service:8082
    routes:
      - name: trip-routes
        paths:
          - /api/trips
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
      - name: destination-routes
        paths:
          - /api/destinations
        strip_path: false
        methods:
          - GET
          - OPTIONS
    plugins:
      - name: cors
        config:
          origins:
            - http://localhost:3000
            - ".*"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - X-User-Id
            - X-User-Roles
          credentials: true
          max_age: 3600

  # ---- Booking Service (Go / Gin) ----
  - name: booking-service
    url: http://booking-service:8083
    routes:
      - name: booking-routes
        paths:
          - /api/bookings
        strip_path: true
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
      - name: admin-saga-routes
        paths:
          - /api/admin
        strip_path: true
        methods:
          - GET
          - POST
          - OPTIONS
    plugins:
      - name: cors
        config:
          origins:
            - http://localhost:3000
            - ".*"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - X-User-Id
            - X-User-Roles
            - X-Simulate-Failure
          credentials: true
          max_age: 3600

  # ---- Recommendation Service (Python / FastAPI) ----
  - name: recommendation-service
    url: http://recommendation-service:8084
    routes:
      - name: recommendation-routes
        paths:
          - /api/recommendations
        strip_path: true
        methods:
          - GET
          - POST
          - OPTIONS
    plugins:
      - name: cors
        config:
          origins:
            - http://localhost:3000
            - ".*"
          methods:
            - GET
            - POST
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - X-User-Id
            - X-User-Roles
          credentials: true
          max_age: 3600

  # ---- Route Optimization Service (C++ / Crow) ----
  - name: route-service
    url: http://route-service:8085
    routes:
      - name: route-routes
        paths:
          - /api/routes
        strip_path: true
        methods:
          - GET
          - POST
          - OPTIONS
    plugins:
      - name: cors
        config:
          origins:
            - http://localhost:3000
            - ".*"
          methods:
            - GET
            - POST
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - X-User-Id
            - X-User-Roles
          credentials: true
          max_age: 3600

  # ---- Health Routes (public, no auth) ----
  - name: health-user
    url: http://user-service:8081/health
    routes:
      - name: health-user-route
        paths:
          - /api/users/health
        strip_path: true
        methods:
          - GET
  - name: health-trip
    url: http://trip-service:8082/health
    routes:
      - name: health-trip-route
        paths:
          - /api/trips/health
        strip_path: true
        methods:
          - GET
  - name: health-booking
    url: http://booking-service:8083/health
    routes:
      - name: health-booking-route
        paths:
          - /api/bookings/health
        strip_path: true
        methods:
          - GET
  - name: health-recommendation
    url: http://recommendation-service:8084/health
    routes:
      - name: health-recommendation-route
        paths:
          - /api/recommendations/health
        strip_path: true
        methods:
          - GET
  - name: health-route
    url: http://route-service:8085/health
    routes:
      - name: health-route-route
        paths:
          - /api/routes/health
        strip_path: true
        methods:
          - GET

# ---- Global Plugins ----
plugins:
  - name: rate-limiting
    config:
      minute: 100
      policy: local
  - name: request-transformer
    config:
      add:
        headers:
          - "X-Request-Id:$(uuid)"
